# yaml-language-server: $schema=https://platform.claude.com/schemas/ant/beta/environment.json
# ant apply reads each YAML and Markdown resource file in a directory named agents/ as an agent unless the file states its type. This file states type: environment. A README.md is skipped.
# The type line makes this file an environment.
# The session installs the .NET SDK with dotnet-install.sh from dotnet.microsoft.com, so the list of packages is empty.
type: environment
name: dsf-builder
scope: organization
config:
  type: cloud
  packages:
    type: packages
    apt: []
    cargo: []
    gem: []
    go: []
    npm: []
    pip: []
  networking:
    type: limited
    allow_mcp_servers: false
    allow_package_managers: true
    allowed_hosts:
      - builds.dotnet.microsoft.com
      - dotnet.microsoft.com
      - api.nuget.org
      - globalcdn.nuget.org
