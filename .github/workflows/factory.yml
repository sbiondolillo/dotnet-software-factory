# The self-build: the factory builds an issue of its own repo, with the
# factory at the commit of the event. The label `factory` from the owner runs
# it at main. A run by hand runs it at the branch it is started from:
# `gh workflow run factory --ref <branch> -f issue=<n>`. The input `copilot=on`
# adds `--copilot-review on`, and the run then requests a Copilot code review
# and answers its threads through FeedbackRun. The label path passes none.
#
# The run uses `--agent managed`: each agent phase is a Managed Agents session
# of the agent `dsf-builder` in the environment `dsf-builder`. Their ids come
# from .github/agents/claude-lock.json. The job holds the key of the dedicated
# workspace and the private key of the App `dsf-builder`. The session gets only
# an installation token of the App, for this repo. The gates run in a Docker
# container that holds no key, so the job builds the sandbox image.
# docs/agents/sessions.md states what each session holds.
#
# The run name is the number of the issue, `#<n>`, on both paths. So the
# `workflow_run` payload of a failed run names its issue in `display_title`.
#
# The input `base`, a branch, a tag or a commit on one of them, names the commit
# the run builds on. The job resolves it to the full SHA of its commit and passes
# `--base <sha>`, and the run checks that commit out in its clone. The clone
# holds the branches and the tags alone, so a ref such as `refs/pull/<n>/head`
# fails the checkout. The repair loop dispatches this workflow
# at the last green ref of the factory with `base=main`: the factory of that ref
# builds, and the change lands on the head of main. With no `base`, the run
# builds on the head of the default branch, as the clone checks it out.
#
# A starter repo's copy, templates/starter/.github/workflows/factory.yml, runs
# the factory at the tag v1.
name: factory
run-name: "#${{ inputs.issue || github.event.issue.number }}"

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: The number of the issue to run
        required: true
        type: number
      copilot:
        description: Whether the factory requests a Copilot code review and answers its threads, on or off. The repair loop passes on.
        required: false
        type: choice
        options: ['on', 'off']
        default: 'off'
      base:
        description: The branch, tag or commit on one of them that the run builds on, such as main. Empty builds on the head of the default branch.
        required: false
        type: string
        default: ''

# The job's own token reads the check runs of the pull request. A fine-grained token has no Checks permission on a private repo.
permissions:
  checks: read

jobs:
  factory:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'factory' && github.event.sender.login == github.repository_owner)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Read the builder's ids from the lockfile
        run: jq -r '"FACTORY_AGENT_ID=" + (.resources["./builder.yaml"].id // error("claude-lock.json has no id for builder.md")), "FACTORY_ENVIRONMENT_ID=" + (.resources["./builder.environment.yaml"].id // error("claude-lock.json has no id for builder.environment.yaml"))' .github/agents/claude-lock.json >> "$GITHUB_ENV"
      - name: Resolve the base commit
        if: inputs.base
        env:
          BASE: ${{ inputs.base }}
        run: case "$BASE" in -*) echo "The input base starts with -, so it is no ref" >&2; exit 1 ;; esac; git fetch --no-tags --depth=1 origin "$BASE" && sha=$(git rev-parse "FETCH_HEAD^{commit}") && echo "base $BASE is the commit $sha" && echo "FACTORY_BASE_ARGS=--base $sha" >> "$GITHUB_ENV"
      - name: Run the factory
        env:
          FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_SELF_TOKEN }}
          FACTORY_CHECKS_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.JUDGE_ANTHROPIC_API_KEY }}
          FACTORY_APP_PRIVATE_KEY: ${{ secrets.DSF_REPAIR_APP_PRIVATE_KEY }}
          FACTORY_APP_ID: ${{ vars.DSF_REPAIR_APP_ID }}
          FACTORY_APP_INSTALLATION_ID: ${{ vars.DSF_REPAIR_APP_INSTALLATION_ID }}
        run: dotnet run --project src/App -c Release -- run --repo ${{ github.repository }} --issue ${{ inputs.issue || github.event.issue.number }} --skip-integration on --copilot-review ${{ inputs.copilot || 'off' }} --agent managed $FACTORY_BASE_ARGS
      - name: Push the transcripts to the store
        # The store is a private repo. With no store, the step exits 0 at once. The log prints no transcript.
        if: always()
        env:
          STORE_REPO: ${{ secrets.STORE_REPO }}
          STORE_DEPLOY_KEY: ${{ secrets.STORE_DEPLOY_KEY }}
        run: |
          if [ -z "$STORE_REPO" ] || [ -z "$STORE_DEPLOY_KEY" ]; then exit 0; fi
          key="$RUNNER_TEMP/store-key"
          printf '%s\n' "$STORE_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o StrictHostKeyChecking=accept-new"
          export GIT_AUTHOR_NAME=factory GIT_AUTHOR_EMAIL=factory@users.noreply.github.com GIT_COMMITTER_NAME=factory GIT_COMMITTER_EMAIL=factory@users.noreply.github.com
          store="$RUNNER_TEMP/store"
          git clone -q "git@github.com:$STORE_REPO.git" "$store"
          mkdir -p "$store/runs/$GITHUB_RUN_ID"
          if [ -d .factory/sandbox-home ]; then
            find .factory/sandbox-home -type f -name '*.jsonl' -exec cp --parents -t "$store/runs/$GITHUB_RUN_ID" {} +
          fi
          cd "$store"
          git add runs
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Run $GITHUB_RUN_ID of $GITHUB_REPOSITORY"
          for wait in 1 2 3 4 5; do
            if git push -q 2>/dev/null; then exit 0; fi
            sleep "$wait" && git pull -q --rebase
          done
          git push -q
