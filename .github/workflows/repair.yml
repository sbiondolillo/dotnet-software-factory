# The repair loop: a red ci run, or a red factory run on a story, becomes an
# issue with the label repair, written by one Managed Agents session, that
# issue becomes a pull request with the label repair, built by factory.yml,
# that pull request gets a Copilot review with every thread answered, and it
# merges once the judge approved. The job holds the API key and the GitHub
# token. The session holds a read-only repository token, the judge's agent and
# the judge's environment.
#
# The build step starts factory.yml with workflow_dispatch, the issue number
# and copilot=on, as #358 decided. The factory runs at main, opens the pull
# request under FACTORY_SELF_TOKEN, so ci and the judge run on it, and posts
# `Opened <url>` on the issue. The step reads that comment and sets the label.
#
# The Copilot step requests a review by copilot-pull-request-reviewer when the
# head holds none, and polls until a review is on the head and no thread is
# unresolved. The factory answers the threads within its run, three rounds at
# most. A refusal, or a thread still open once that run ended, is one comment
# on the issue and a stop for the SHA. The result is the step output copilot,
# settled, refused or unanswered, for the merge stage.
#
# The merge step runs on settled alone, on the same head, as #355 decided. It
# waits for the check run judge-verdict on that head, and arms GitHub's auto-
# merge with the job's own token, `gh pr merge --auto --squash --delete-branch
# --match-head-commit <sha>`, and disarms it when the head moves. GitHub merges
# when build, integration and judge-verdict pass, and shows app/github-actions
# as the merger. A merge by this token closes no issue, so the step waits for
# the merge and closes the issue with one comment that names the merge commit.
# A push by this token starts no run, so the step then starts ci on main with
# workflow_dispatch. The step merges nothing on a pull request whose head
# branch is the branch of the red run that started the repair. The job has no
# checks permission: the repo is public, so the read of the check run needs
# none, and #361 bars checks: write here, since the protection binds the check
# name and any job with checks: write could post a green judge-verdict. The
# repo needs allow_auto_merge and delete_branch_on_merge on, and main needs the
# required checks build, integration and judge-verdict with enforce_admins. The
# owner sets both.
#
# A workflow_run trigger fires from the file on the default branch alone, and
# it holds the secrets, so this job checks out main and runs no code of the red
# run. A red run of a fork is out, because no job can push onto its branch.
# A red run on a pull request with the label repair is out, since a loop that
# repairs its own pull request would file a second repair.
#
# A red factory run, decided in #399, names its story in display_title, `#<n>`,
# by the run-name of factory.yml. The read step reads it on main alone, and ends
# when the story has the label repair, so a failing builder files no repair of
# itself. Its branch is main, so the repair/* rule binds ci runs alone. It gets
# no rerun: the class flake dispatches the story once more. The class factory
# files an issue with repair, ready and factory and a line `Story: #<n>`, one at
# a time, and the class code is a comment on the story.
#
# The job reruns a ci run on its first attempt, and the end of that rerun fires
# this workflow again. The concurrency group holds that second job until the
# first ends, and the second then finds the first one's issue or marker comment.
#
# The kill switch is the variable REPAIR_ENABLED. The job exits 0 at once on a
# workflow_run event when it is not true. A run by hand skips the switch in the
# read step, for development on a planted fault: `gh workflow run repair.yml
# -f run=<run id>`. The merge step reads the switch on every event, and merges
# nothing when it is not true. A run by hand with an issue number runs the
# build step, the Copilot step and the merge step:
# `gh workflow run repair.yml -f issue=<n>`. A run by hand with a pull request
# number runs the Copilot step and the merge step:
# `gh workflow run repair.yml -f pr=<n>`. That is the route for a pull request
# that waited while the switch was off.
# Secrets: JUDGE_ANTHROPIC_API_KEY, JUDGE_GITHUB_RO_TOKEN.
# Variables: JUDGE_AGENT_ID, JUDGE_ENVIRONMENT_ID, REPAIR_ENABLED.
name: repair

on:
  workflow_run:
    workflows: [ci, factory]
    types: [completed]
  workflow_dispatch:
    inputs:
      run:
        description: The id of the red run
        required: false
        type: string
      issue:
        description: The number of a repair issue, to build with no read
        required: false
        type: string
      pr:
        description: The number of a repair pull request, to watch with no read and no build
        required: false
        type: string

# actions reruns the run, reads its log and starts factory.yml, for a build or
# for the story of a flaky factory run. contents posts a comment on a commit of
# main, and with pull-requests merges the pull request.
# No checks, as #361 decided.
permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: repair-${{ inputs.pr && format('pr-{0}', inputs.pr) || inputs.issue && format('issue-{0}', inputs.issue) || inputs.run || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
      (endsWith(github.event.workflow_run.path, '/factory.yml') ||
      !startsWith(github.event.workflow_run.head_branch, 'repair/')) &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - uses: actions/checkout@v7
      - name: Read the red run
        id: read
        if: ${{ !inputs.issue && !inputs.pr }}
        env:
          GH_TOKEN: ${{ github.token }}
          JUDGE_ANTHROPIC_API_KEY: ${{ secrets.JUDGE_ANTHROPIC_API_KEY }}
          JUDGE_GITHUB_RO_TOKEN: ${{ secrets.JUDGE_GITHUB_RO_TOKEN }}
          JUDGE_AGENT_ID: ${{ vars.JUDGE_AGENT_ID }}
          JUDGE_ENVIRONMENT_ID: ${{ vars.JUDGE_ENVIRONMENT_ID }}
          REPAIR_ENABLED: ${{ vars.REPAIR_ENABLED }}
          RUN_ID: ${{ inputs.run || github.event.workflow_run.id }}
        run: python3 .github/repair/read.py "$RUN_ID"
      - name: Build the repair issue
        id: build
        if: ${{ !inputs.pr && (inputs.issue || steps.read.outputs.issue) }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue || steps.read.outputs.issue }}
        run: python3 .github/repair/build.py "$ISSUE"
      - name: Watch the Copilot review
        id: copilot
        if: ${{ inputs.pr || steps.build.outputs.pr }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr || steps.build.outputs.pr }}
          FACTORY_RUN: ${{ steps.build.outputs.run }}
        run: python3 .github/repair/copilot.py "$PR"
      - name: Merge the repair pull request
        id: merge
        if: ${{ steps.copilot.outputs.copilot == 'settled' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr || steps.build.outputs.pr }}
          SHA: ${{ steps.copilot.outputs.sha }}
          REPAIR_ENABLED: ${{ vars.REPAIR_ENABLED }}
        run: python3 .github/repair/merge.py "$PR" "$SHA"
