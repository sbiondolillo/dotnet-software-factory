# The judge: the three angles of .claude/skills/change/JUDGES.md on a pull
# request, each one a Managed Agents session, started and read by this job.
# The job holds the API key and the GitHub token. The sessions hold a
# read-only repository token. The verdict is computed here, in code, and the
# synthesis session runs only when an angle rejects. The mutation angle
# stays on the runner arm until the sandbox has a 10.0.4xx SDK, so the
# default angles are Conformance and Regressions and style.
#
# The job posts its verdict as the check run judge-verdict, which main requires.
# The check named judge is this job, and it passes when the verdict rejects.
# Only a Report decides: an angle whose session gives no Report never rejects
# and never accepts. When no Report rejects and an angle has no Report, the job
# posts no comment and no judge-verdict, and fails. A rerun of the job then
# judges the head again.
#
# A pull request that the repository owner opened is judged on its head, at each
# push. The gate reads the author of the pull request, not the pusher.
# A pull request that dependabot[bot] opened takes the automatic path of #448:
# .github/judge/bump.py tests the four conditions of a pure bump, and a pure bump
# gets judge-verdict as success with no agent session, titled "Dependabot bump,
# no agent read it". Any other Dependabot pull request gets no check run: the log
# lists each failed condition, and the owner dispatches the judge by hand.
# By hand: `gh workflow run judge.yml -f pr=<n>`. A dispatch always runs the full
# judge, for any author. The full judge dedupes on the head SHA and the spec.
# Secrets: JUDGE_ANTHROPIC_API_KEY (a dedicated workspace), JUDGE_GITHUB_RO_TOKEN
# (fine-grained, this repo, Contents, Pull requests and Metadata read).
# Variables: JUDGE_AGENT_ID, JUDGE_ENVIRONMENT_ID.
name: judge

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: The number of the pull request to judge
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: read

concurrency:
  group: judge-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.user.login == github.repository_owner
      || github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - name: Judge the pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          JUDGE_ANTHROPIC_API_KEY: ${{ secrets.JUDGE_ANTHROPIC_API_KEY }}
          JUDGE_GITHUB_RO_TOKEN: ${{ secrets.JUDGE_GITHUB_RO_TOKEN }}
          JUDGE_AGENT_ID: ${{ vars.JUDGE_AGENT_ID }}
          JUDGE_ENVIRONMENT_ID: ${{ vars.JUDGE_ENVIRONMENT_ID }}
        run: python3 .github/judge/judge.py ${{ inputs.pr || github.event.pull_request.number }}
